<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>HOTA 夏季公會賽 2026｜尖端組決賽</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1080px; height:1920px; }
body {
  background:
    radial-gradient(circle at 50% 16%, rgba(255,140,0,.40), transparent 46%),
    radial-gradient(circle at 16% 82%, rgba(255,40,0,.30), transparent 52%),
    radial-gradient(circle at 86% 72%, rgba(255,95,0,.24), transparent 52%),
    linear-gradient(165deg, #1a0500 0%, #2c0a04 42%, #100300 100%);
  color:#fff;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
  overflow:hidden; position:relative;
}
.glow {
  position:absolute; inset:0; pointer-events:none;
  background: radial-gradient(640px 320px at 50% 30%, rgba(255,170,0,.16), transparent 70%);
}
.crown {
  position:absolute; top:52%; left:50%;
  transform:translate(-50%,-50%);
  width:900px; opacity:.14; filter:blur(5px);
  z-index:1; pointer-events:none;
}
.crown svg { width:100%; display:block; }
.wrap {
  position:relative; z-index:3;
  height:100%; display:flex; flex-direction:column;
  padding:96px 70px 84px;
}
.top { text-align:center; }
.badge {
  display:inline-block;
  background: rgba(255,80,0,.18);
  border:2px solid rgba(255,150,0,.65);
  color:#ffb347;
  padding:14px 38px; border-radius:999px;
  font-size:27px; font-weight:800; letter-spacing:5px;
  margin-bottom:38px;
  box-shadow: 0 0 26px rgba(255,120,0,.45);
}
h1 {
  font-size:104px; font-weight:900; letter-spacing:10px; line-height:1.04;
  color:#ffce4d;
  text-shadow: 0 5px 0 #b3400a, 0 8px 28px rgba(255,90,0,.6);
  margin-bottom:18px;
}
.sub { font-size:34px; color:#ffd9a0; letter-spacing:8px; margin-bottom:26px; }
.time {
  display:inline-block;
  font-size:44px; font-weight:900; letter-spacing:4px;
  color:#fff;
  background: linear-gradient(90deg, #ff2d00, #ff8a00);
  padding:16px 46px; border-radius:16px;
  box-shadow: 0 0 40px rgba(255,70,0,.65);
}
.mid { flex:1; display:flex; align-items:center; justify-content:center; }
.fighters { display:flex; align-items:center; justify-content:center; gap:26px; width:100%; }
.fighter { text-align:center; width:400px; }
.avatar-wrap {
  width:340px; height:340px; margin:0 auto 32px;
  border-radius:50%;
  border:8px solid #ff5a00;
  box-shadow: 0 0 55px rgba(255,90,0,.6), inset 0 0 44px rgba(0,0,0,.4);
  overflow:hidden; background:#000;
}
.avatar { width:100%; height:100%; object-fit:cover; }
.fighter .name {
  font-size:44px; font-weight:900; margin-bottom:12px;
  color:#ffd27a;
  text-shadow: 0 2px 14px rgba(255,80,0,.55);
}
.fighter .id { font-size:28px; color:#ffb347; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing:1px; }
.vs {
  font-size:128px; font-weight:900; color:#ff3d00;
  text-shadow: 0 0 44px rgba(255,60,0,.7); line-height:1;
}
.bottom { }
.rules-box {
  background: rgba(255,60,0,.09);
  border:1.5px solid rgba(255,120,0,.38);
  border-radius:30px; padding:44px 56px; width:100%;
}
.rules-box h3 { font-size:32px; color:#ff8a00; margin-bottom:24px; letter-spacing:3px; }
.rules-box ul { list-style:none; font-size:28px; line-height:2.05; color:#ffe6cf; }
.rules-box li { padding-left:44px; position:relative; }
.rules-box li::before { content:"🔥"; position:absolute; left:0; top:2px; }
</style>
</head>
<body>
<div class="glow"></div>
<div class="crown">
  <svg viewBox="0 0 240 170" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffe9a8"/>
        <stop offset="1" stop-color="#ff9d2e"/>
      </linearGradient>
    </defs>
    <path d="M20 150 L35 70 L75 110 L120 45 L165 110 L205 70 L220 150 Z" fill="url(#g)"/>
    <rect x="18" y="140" width="204" height="26" rx="6" fill="url(#g)"/>
    <circle cx="120" cy="153" r="9" fill="#ff4d2e"/>
    <circle cx="78" cy="153" r="7" fill="#ffd23f"/>
    <circle cx="162" cy="153" r="7" fill="#ffd23f"/>
    <circle cx="35" cy="66" r="10" fill="#ffe9a8"/>
    <circle cx="120" cy="40" r="11" fill="#ffe9a8"/>
    <circle cx="205" cy="66" r="10" fill="#ffe9a8"/>
  </svg>
</div>
<div class="wrap">
  <div class="top">
    <div class="badge">🏆 HOTA 夏季公會賽 2026</div>
    <h1>尖端組 決賽</h1>
    <div class="sub">GRAND FINALS · TOP GROUP</div>
    <div class="time">🔥 7月30日 23:00 開戰 🔥</div>
  </div>

  <div class="mid">
    <div class="fighters">
      <div class="fighter">
        <div class="avatar-wrap"><img class="avatar" src="assets/chenfongsing.jpg" alt="chenfongsing"></div>
        <div class="name">chenfongsing</div>
        <div class="id">@chenfongsing</div>
      </div>
      <div class="vs">VS</div>
      <div class="fighter">
        <div class="avatar-wrap"><img class="avatar" src="assets/weeeeee0406.jpg" alt="weeeeee0406"></div>
        <div class="name">weeeeee0406</div>
        <div class="id">@weeeeee0406</div>
      </div>
    </div>
  </div>

  <div class="bottom">
    <div class="rules-box">
      <h3>⚔️ 決賽規則</h3>
      <ul>
        <li>對戰形式：1v1 單挑，三局兩勝（先贏兩局者勝出）。</li>
        <li>道具卡：本輪不使用道具卡。</li>
        <li>排名規則：按贏家實際鑽石數進行排名；單局對決贏了之後，緊盯實際鑽石（可選日榜）角逐冠亞季軍。</li>
      </ul>
    </div>
  </div>
</div>
</body>
</html>
